name: Build Android APK

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Download Gradle 8.0.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.0.2-bin.zip
          unzip -q gradle-8.0.2-bin.zip
          echo "$GITHUB_WORKSPACE/gradle-8.0.2/bin" >> $GITHUB_PATH

      - name: Build APK with Gradle
        run: gradle assembleDebug --stacktrace --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: Niimbot-B1-PrepLabels-v2-APK
          path: app/build/outputs/apk/debug/*.apk
